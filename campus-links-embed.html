.off{display:none}

<script>
const tabs=[...document.querySelectorAll('.t')],rows=[...document.querySelectorAll('.r')];
let idx=0;
function setCat(cat){
  idx=Math.max(0,tabs.findIndex(t=>t.dataset.cat===cat));
  tabs.forEach((x,i)=>x.classList.toggle('on',i===idx));
  rows.forEach(r=>r.classList.toggle('off',!(cat==='all'||r.dataset.cat===cat)));
  post();
}
tabs.forEach(t=>t.addEventListener('click',()=>setCat(t.dataset.cat)));
document.querySelector('.prev').addEventListener('click',()=>setCat(tabs[(idx-1+tabs.length)%tabs.length].dataset.cat));
document.querySelector('.next').addEventListener('click',()=>setCat(tabs[(idx+1)%tabs.length].dataset.cat));
function post(){parent.postMessage({linksHeight:Math.ceil(document.body.getBoundingClientRect().height)},'*')}
addEventListener('load',post); addEventListener('resize',post); post();
</script>
